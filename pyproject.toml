[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constraint-music"
version = "2.6.0a1"
description = "Deterministic constraint-programming music synthesis with independent verification"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Constraint Music contributors"}]
dependencies = [
  "ortools>=9.15,<10",
  "mido>=1.3,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
constraint-music = "constraint_music.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["constraint_music"]

[[tool.mypy.overrides]]
module = ["mido", "mido.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["constraint_music"]
