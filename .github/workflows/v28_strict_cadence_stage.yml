name: Stage strict v2.8 cadence repair

on:
  push:
    branches: ["staging/v2.8-strict-cadence"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply strict local-key-domain and cadence repair
        run: |
          python - <<'PY'
          from pathlib import Path

          models = Path("src/constraint_music/models.py")
          text = models.read_text()
          old = (
              "    @property\n"
              "    def progression_pairs(self) -> tuple[tuple[int, int], ...]:\n"
          )
          new = (
              "    def context_pitches_in_range(self, low: int, high: int) -> tuple[int, ...]:\n"
              "        \"\"\"Return pitches admitted by any declared persistent local-key region.\"\"\"\n"
              "        pitch_classes = {\n"
              "            pitch_class\n"
              "            for key in self.context_keys\n"
              "            for pitch_class in key.pitch_classes\n"
              "        }\n"
              "        return tuple(\n"
              "            note for note in range(low, high + 1) if note % 12 in pitch_classes\n"
              "        )\n"
              "\n"
              "    @property\n"
              "    def progression_pairs(self) -> tuple[tuple[int, int], ...]:\n"
          )
          if old not in text:
              raise SystemExit("models context-domain anchor missing")
          models.write_text(text.replace(old, new, 1))

          solver = Path("src/constraint_music/solver.py")
          text = solver.read_text()
          old = (
              "        melody_domain = spec.tonal_key.pitches_in_range(spec.melody_low, spec.melody_high)\n"
              "        bass_domain = spec.tonal_key.pitches_in_range(spec.bass_low, spec.bass_high)\n"
          )
          new = (
              "        melody_domain = (\n"
              "            spec.context_pitches_in_range(spec.melody_low, spec.melody_high)\n"
              "            if spec.modulation_enabled\n"
              "            else spec.tonal_key.pitches_in_range(spec.melody_low, spec.melody_high)\n"
              "        )\n"
              "        bass_domain = (\n"
              "            spec.context_pitches_in_range(spec.bass_low, spec.bass_high)\n"
              "            if spec.modulation_enabled\n"
              "            else spec.tonal_key.pitches_in_range(spec.bass_low, spec.bass_high)\n"
              "        )\n"
          )
          if old not in text:
              raise SystemExit("solver pitch-domain anchor missing")
          solver.write_text(text.replace(old, new, 1))

          runtime = Path("src/constraint_music/modulation_runtime.py")
          text = runtime.read_text()
          old = (
              "    global_key = spec.tonal_key\n"
              "    soprano_domain = global_key.pitches_in_range(spec.melody_low, spec.melody_high)\n"
              "    bass_domain = global_key.pitches_in_range(spec.bass_low, spec.bass_high)\n"
          )
          new = (
              "    soprano_domain = spec.context_pitches_in_range(spec.melody_low, spec.melody_high)\n"
              "    bass_domain = spec.context_pitches_in_range(spec.bass_low, spec.bass_high)\n"
          )
          if old not in text:
              raise SystemExit("runtime outer-domain anchor missing")
          text = text.replace(old, new, 1)

          old = (
              "            for beat, (left_var, right_var) in enumerate(pairwise(voice_vars)):\n"
              "                # The certified terminal V-I cadence is governed by CM047;\n"
              "                # generic inner-voice CM032 remains active on every earlier transition.\n"
              "                if beat == spec.total_beats - 2:\n"
              "                    continue\n"
              "                key = spec.active_key_at_beat(beat)\n"
          )
          new = (
              "            for beat, (left_var, right_var) in enumerate(pairwise(voice_vars)):\n"
              "                key = spec.active_key_at_beat(beat)\n"
          )
          if old not in text:
              raise SystemExit("runtime solver CM032 exemption anchor missing")
          text = text.replace(old, new, 1)

          anchor = (
              "                model.add_allowed_assignments([left_var, right_var], allowed)\n"
              "\n"
              "    if spec.expanded_harmony_enabled:\n"
          )
          insert = (
              "                model.add_allowed_assignments([left_var, right_var], allowed)\n"
              "\n"
              "        destination = spec.modulation_destination\n"
              "        if destination is None:\n"
              "            raise ValueError(\"Validated modulation spec lost destination identity\")\n"
              "        cadence_beat = spec.total_beats - 2\n"
              "        for voice_vars, domain in (\n"
              "            (soprano, soprano_domain),\n"
              "            (alto, alto_domain),\n"
              "            (tenor, tenor_domain),\n"
              "            (bass_note, bass_domain),\n"
              "        ):\n"
              "            terminal_rows = [\n"
              "                (left_note, right_note)\n"
              "                for left_note in domain\n"
              "                for right_note in domain\n"
              "                if left_note % 12 != destination.leading_tone_pc\n"
              "                or right_note == left_note + 1\n"
              "            ]\n"
              "            model.add_allowed_assignments(\n"
              "                [voice_vars[cadence_beat], voice_vars[cadence_beat + 1]], terminal_rows\n"
              "            )\n"
              "\n"
              "    if spec.expanded_harmony_enabled:\n"
          )
          if anchor not in text:
              raise SystemExit("runtime terminal solver insertion anchor missing")
          text = text.replace(anchor, insert, 1)

          old = (
              "            for beat, (left, right) in enumerate(pairwise(voice)):\n"
              "                if beat == spec.total_beats - 2:\n"
              "                    continue\n"
              "                key = spec.active_key_at_beat(beat)\n"
          )
          new = (
              "            for beat, (left, right) in enumerate(pairwise(voice)):\n"
              "                key = spec.active_key_at_beat(beat)\n"
          )
          if old not in text:
              raise SystemExit("runtime verifier CM032 exemption anchor missing")
          text = text.replace(old, new, 1)

          anchor = (
              "    if result.effective_rhythm[-1] is not RhythmState.ONSET:\n"
              "        issues.append((\"CM047\", \"Destination tonic must be a newly articulated onset\"))\n"
              "    return tuple(issues)\n"
          )
          insert = (
              "    if result.effective_rhythm[-1] is not RhythmState.ONSET:\n"
              "        issues.append((\"CM047\", \"Destination tonic must be a newly articulated onset\"))\n"
              "    cadence_beat = spec.total_beats - 2\n"
              "    terminal_voices = (\n"
              "        (\"soprano\", result.soprano),\n"
              "        (\"alto\", result.alto),\n"
              "        (\"tenor\", result.tenor),\n"
              "        (\"bass\", result.bass),\n"
              "    )\n"
              "    terminal_pcs = {voice[cadence_beat] % 12 for _, voice in terminal_voices}\n"
              "    if destination.leading_tone_pc not in terminal_pcs:\n"
              "        issues.append((\"CM047\", \"Destination dominant omits its leading tone\"))\n"
              "    for label, voice in terminal_voices:\n"
              "        left = voice[cadence_beat]\n"
              "        right = voice[cadence_beat + 1]\n"
              "        if left % 12 == destination.leading_tone_pc and right != left + 1:\n"
              "            issues.append(\n"
              "                (\"CM047\", f\"{label} destination leading tone fails upward resolution\")\n"
              "            )\n"
              "    return tuple(issues)\n"
          )
          if anchor not in text:
              raise SystemExit("runtime CM047 verifier insertion anchor missing")
          runtime.write_text(text.replace(anchor, insert, 1))

          tests = Path("tests/test_modulation.py")
          text = tests.read_text()
          anchor = (
              "def test_shifted_or_forged_key_context_is_rejected() -> None:\n"
          )
          new_tests = '''def test_modulation_domains_include_destination_accidental_and_terminal_resolution_is_strict() -> None:\n    spec = base_spec()\n    destination = spec.modulation_destination\n    assert destination is not None\n    destination_only = next(\n        note\n        for note in range(spec.melody_low, spec.melody_high + 1)\n        if note % 12 == destination.leading_tone_pc\n        and note not in spec.tonal_key.pitches_in_range(spec.melody_low, spec.melody_high)\n    )\n    assert destination_only in spec.context_pitches_in_range(spec.melody_low, spec.melody_high)\n\n    result = modulated_piece()\n    cadence_beat = spec.total_beats - 2\n    voices = (\n        (\"soprano\", result.soprano),\n        (\"alto\", result.alto),\n        (\"tenor\", result.tenor),\n        (\"bass\", result.bass),\n    )\n    carriers = [\n        (label, voice)\n        for label, voice in voices\n        if voice[cadence_beat] % 12 == destination.leading_tone_pc\n    ]\n    assert carriers\n    assert any(label in {\"soprano\", \"bass\"} for label, _ in carriers)\n    for _, voice in carriers:\n        assert voice[cadence_beat + 1] == voice[cadence_beat] + 1\n\n\ndef test_terminal_destination_leading_tone_tampering_is_rejected_by_cm047() -> None:\n    result = modulated_piece()\n    destination = result.spec.modulation_destination\n    assert destination is not None\n    cadence_beat = result.spec.total_beats - 2\n    for label in (\"soprano\", \"alto\", \"tenor\", \"bass\"):\n        voice = getattr(result, label)\n        if voice[cadence_beat] % 12 != destination.leading_tone_pc:\n            continue\n        forged = list(voice)\n        forged[cadence_beat + 1] = forged[cadence_beat] + 2\n        report = verify_result(replace(result, **{label: tuple(forged)}))\n        assert not report.valid\n        assert \"CM047\" in report.failed_rules\n        assert any(\"destination leading tone fails upward resolution\" in issue for issue in report.issues)\n        break\n    else:\n        pytest.fail(\"Certified destination dominant must contain a leading-tone carrier\")\n\n\n'''
          if anchor not in text:
              raise SystemExit("modulation test insertion anchor missing")
          tests.write_text(text.replace(anchor, new_tests + anchor, 1))

          for path in (Path("pyproject.toml"), Path("src/constraint_music/__init__.py")):
              text = path.read_text()
              if "2.8.0a1" not in text:
                  raise SystemExit(f"version anchor missing in {path}")
              path.write_text(text.replace("2.8.0a1", "2.8.0a2", 1))
          PY
      - name: Remove staging workflow from resulting tree
        run: rm .github/workflows/v28_strict_cadence_stage.yml
      - name: Run focused quality gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check src tests
          mypy --python-version "3.13" src
          pytest -q tests/test_modulation.py
          python -m build
      - name: Commit verified repair tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v2.8): restore strict destination-cadence leading-tone resolution"
          git push origin HEAD:staging/v2.8-strict-cadence
