name: Stage v2.8 active-key verifier repair

on:
  push:
    branches: ["staging/v2.8-strict-cadence"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reconstruct verified repair candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          def extract_block(path: str, occurrence: int) -> str:
              workflow = Path(path).read_text()
              marker = "          python - <<'PY'\n"
              cursor = -1
              for _ in range(occurrence):
                  cursor = workflow.index(marker, cursor + 1)
              start = cursor + len(marker)
              end = workflow.index("          PY\n", start)
              lines = workflow[start:end].splitlines()
              return "\n".join(
                  line[10:] if line.startswith("          ") else line for line in lines
              ) + "\n"

          Path("/tmp/v28_base_repair.py").write_text(
              extract_block(".github/workflows/v28_strict_cadence_stage.yml", 1)
          )
          Path("/tmp/v28_objective_repair.py").write_text(
              extract_block(".github/workflows/v28_strict_objective_stage.yml", 2)
          )
          PY
          python /tmp/v28_base_repair.py
          python /tmp/v28_objective_repair.py
      - name: Apply active-key verifier symmetry and adversarial tests
        run: |
          python - <<'PY'
          from pathlib import Path

          verifier = Path("src/constraint_music/verifier.py")
          text = verifier.read_text()
          old = (
              "    key_pcs = set(key.pitch_classes)\n"
              "    for index, note in enumerate(melody):\n"
              "        if note % 12 not in key_pcs:\n"
              "            fail(\"CM002\", f\"Melody step {index}: note {note} is outside {key}\")\n"
              "        if not spec.melody_low <= note <= spec.melody_high:\n"
              "            fail(\"CM002\", f\"Melody step {index}: note {note} is outside the configured range\")\n"
              "\n"
              "    for beat, note in enumerate(bass):\n"
              "        if note % 12 not in key_pcs:\n"
              "            fail(\"CM003\", f\"Bass beat {beat}: note {note} is outside {key}\")\n"
              "        if not spec.bass_low <= note <= spec.bass_high:\n"
              "            fail(\"CM003\", f\"Bass beat {beat}: note {note} is outside the configured range\")\n"
          )
          new = (
              "    for index, note in enumerate(melody):\n"
              "        active_key = (\n"
              "            spec.active_key_at_beat(index // spec.subdivisions_per_beat)\n"
              "            if spec.modulation_enabled\n"
              "            else key\n"
              "        )\n"
              "        if note % 12 not in active_key.pitch_classes:\n"
              "            fail(\n"
              "                \"CM002\",\n"
              "                f\"Melody step {index}: note {note} is outside {active_key}\",\n"
              "            )\n"
              "        if not spec.melody_low <= note <= spec.melody_high:\n"
              "            fail(\"CM002\", f\"Melody step {index}: note {note} is outside the configured range\")\n"
              "\n"
              "    for beat, note in enumerate(bass):\n"
              "        active_key = spec.active_key_at_beat(beat) if spec.modulation_enabled else key\n"
              "        if note % 12 not in active_key.pitch_classes:\n"
              "            fail(\"CM003\", f\"Bass beat {beat}: note {note} is outside {active_key}\")\n"
              "        if not spec.bass_low <= note <= spec.bass_high:\n"
              "            fail(\"CM003\", f\"Bass beat {beat}: note {note} is outside the configured range\")\n"
          )
          if old not in text:
              raise SystemExit("CM002/CM003 verifier anchor missing")
          verifier.write_text(text.replace(old, new, 1))

          tests = Path("tests/test_modulation.py")
          text = tests.read_text()
          anchor = "def test_terminal_destination_leading_tone_tampering_is_rejected_by_cm047() -> None:\n"
          new_tests = '''def test_verifier_rejects_melody_pitch_from_wrong_persistent_key_region() -> None:\n    spec = base_spec(subdivisions_per_beat=2, seed=2815)\n    result = ConstraintMusicSolver().generate(spec)\n    assert isinstance(result, ModulatedSatbGenerationResult)\n    destination = spec.modulation_destination\n    assert destination is not None\n\n    pre_step = 1\n    destination_only = next(\n        note\n        for note in range(spec.melody_low, spec.melody_high + 1)\n        if note % 12 in destination.pitch_classes\n        and note % 12 not in spec.tonal_key.pitch_classes\n    )\n    forged = list(result.melody)\n    forged[pre_step] = destination_only\n    report = verify_result(replace(result, melody=tuple(forged)))\n    assert not report.valid\n    assert \"CM002\" in report.failed_rules\n\n    post_step = spec.modulation_boundary_beat * spec.subdivisions_per_beat + 1\n    source_only = next(\n        note\n        for note in range(spec.melody_low, spec.melody_high + 1)\n        if note % 12 in spec.tonal_key.pitch_classes\n        and note % 12 not in destination.pitch_classes\n    )\n    forged = list(result.melody)\n    forged[post_step] = source_only\n    report = verify_result(replace(result, melody=tuple(forged)))\n    assert not report.valid\n    assert \"CM002\" in report.failed_rules\n\n\ndef test_verifier_rejects_bass_pitch_from_wrong_destination_region() -> None:\n    result = modulated_piece()\n    spec = result.spec\n    destination = spec.modulation_destination\n    assert destination is not None\n    source_only = next(\n        note\n        for note in range(spec.bass_low, spec.bass_high + 1)\n        if note % 12 in spec.tonal_key.pitch_classes\n        and note % 12 not in destination.pitch_classes\n    )\n    forged = list(result.bass)\n    forged[spec.modulation_boundary_beat] = source_only\n    report = verify_result(replace(result, bass=tuple(forged)))\n    assert not report.valid\n    assert \"CM003\" in report.failed_rules\n\n\n'''
          if anchor not in text:
              raise SystemExit("verifier adversarial test anchor missing")
          tests.write_text(text.replace(anchor, new_tests + anchor, 1))
          PY
      - name: Remove staging-only workflows
        run: |
          rm .github/workflows/v28_strict_cadence_stage.yml
          rm .github/workflows/v28_strict_objective_stage.yml
          rm .github/workflows/v28_strict_verifier_stage.yml
      - name: Run focused quality gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check src tests
          mypy --python-version "3.13" src
          pytest -q tests/test_modulation.py
          python -m build
      - name: Commit verified repair tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v2.8): enforce strict local-key domains and cadence resolution"
          git push origin HEAD:staging/v2.8-strict-cadence
