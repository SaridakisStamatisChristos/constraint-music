name: Stage v2.8 active-key objective repair

on:
  push:
    branches: ["staging/v2.8-strict-cadence"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply base strict-cadence repair
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/v28_strict_cadence_stage.yml").read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          Path("/tmp/v28_base_repair.py").write_text(script + "\n")
          PY
          python /tmp/v28_base_repair.py
      - name: Apply active-key melody and objective repair
        run: |
          python - <<'PY'
          from pathlib import Path

          tonal = Path("src/constraint_music/compiler_tonal.py")
          text = tonal.read_text()
          anchor = (
              "    key = spec.tonal_key\n"
              "    pair_rows_by_leading_pc: dict[int, list[tuple[int, int]]] = {}\n"
          )
          replacement = (
              "    key = spec.tonal_key\n"
              "    if spec.modulation_enabled:\n"
              "        for step, choice in enumerate(melody_choice):\n"
              "            active_key = spec.active_key_at_beat(step // spec.subdivisions_per_beat)\n"
              "            allowed_indices = [\n"
              "                (index,)\n"
              "                for index, note in enumerate(melody_domain)\n"
              "                if note % 12 in active_key.pitch_classes\n"
              "            ]\n"
              "            model.add_allowed_assignments([choice], allowed_indices)\n"
              "\n"
              "    pair_rows_by_leading_pc: dict[int, list[tuple[int, int]]] = {}\n"
          )
          if anchor not in text:
              raise SystemExit("active-key melody-domain anchor missing")
          tonal.write_text(text.replace(anchor, replacement, 1))

          objective = Path("src/constraint_music/objective.py")
          text = objective.read_text()
          old = (
              "    key = spec.tonal_key\n"
              "    target = spec.expanded_tension()\n"
              "    chord_tension_table = CHORD_TENSION[spec.mode]\n"
              "    melody_tension_table = [DEGREE_TENSION[key.degree_of_pc(note % 12)] for note in melody_domain]\n"
          )
          new = (
              "    target = spec.expanded_tension()\n"
              "    chord_tension_table = CHORD_TENSION[spec.mode]\n"
          )
          if old not in text:
              raise SystemExit("compiled objective global-key anchor missing")
          text = text.replace(old, new, 1)

          old = (
              "        model.add_element(\n"
              "            melody_choice[beat * spec.subdivisions_per_beat], melody_tension_table, melody_tension\n"
              "        )\n"
          )
          new = (
              "        active_key = spec.active_key_at_beat(beat)\n"
              "        melody_tension_table = [\n"
              "            DEGREE_TENSION[active_key.degree_of_pc(note % 12)]\n"
              "            if note % 12 in active_key.pitch_classes\n"
              "            else 0\n"
              "            for note in melody_domain\n"
              "        ]\n"
              "        model.add_element(\n"
              "            melody_choice[beat * spec.subdivisions_per_beat],\n"
              "            melody_tension_table,\n"
              "            melody_tension,\n"
              "        )\n"
          )
          if old not in text:
              raise SystemExit("compiled objective melody table anchor missing")
          text = text.replace(old, new, 1)

          old = (
              "    key = spec.tonal_key\n"
              "    target = spec.expanded_tension()\n"
          )
          new = "    target = spec.expanded_tension()\n"
          if old not in text:
              raise SystemExit("independent objective global-key anchor missing")
          text = text.replace(old, new, 1)

          old = (
              "        chord_tension = CHORD_TENSION[spec.mode][chord]\n"
              "        melody_tension = DEGREE_TENSION[key.degree_of_pc(melody % 12)]\n"
          )
          new = (
              "        active_key = spec.active_key_at_beat(beat)\n"
              "        chord_tension = CHORD_TENSION[spec.mode][chord]\n"
              "        melody_tension = DEGREE_TENSION[active_key.degree_of_pc(melody % 12)]\n"
          )
          if old not in text:
              raise SystemExit("independent objective local-key anchor missing")
          objective.write_text(text.replace(old, new, 1))

          tests = Path("tests/test_modulation.py")
          text = tests.read_text()
          anchor = "def test_terminal_destination_leading_tone_tampering_is_rejected_by_cm047() -> None:\n"
          new_test = '''def test_every_melody_step_stays_inside_its_persistent_local_key() -> None:\n    spec = base_spec(subdivisions_per_beat=2, seed=2814)\n    result = ConstraintMusicSolver().generate(spec)\n    assert isinstance(result, ModulatedSatbGenerationResult)\n    for step, note in enumerate(result.melody):\n        beat = step // spec.subdivisions_per_beat\n        assert note % 12 in spec.active_key_at_beat(beat).pitch_classes\n\n\n'''
          if anchor not in text:
              raise SystemExit("weak-step context test anchor missing")
          tests.write_text(text.replace(anchor, new_test + anchor, 1))
          PY
      - name: Remove staging-only workflows
        run: |
          rm .github/workflows/v28_strict_cadence_stage.yml
          rm .github/workflows/v28_strict_objective_stage.yml
      - name: Run focused quality gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check src tests
          mypy --python-version "3.13" src
          pytest -q tests/test_modulation.py
          python -m build
      - name: Commit verified repair tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v2.8): enforce strict local-key domains and cadence resolution"
          git push origin HEAD:staging/v2.8-strict-cadence
