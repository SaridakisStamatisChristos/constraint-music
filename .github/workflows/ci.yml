name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Diagnostic Ruff auto-fix diff
        run: |
          ruff check --fix src tests || true
          git diff -- src/constraint_music/secondary_leading_tone_seventh_runtime.py
          exit 1
      - run: mypy --python-version "${{ matrix.python-version }}" src
      - run: pytest --cov=constraint_music --cov-report=term-missing
      - run: python -m build
