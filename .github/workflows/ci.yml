name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore frozen research history
        run: git fetch --no-tags research/history/multifixture_assurance_v1.bundle refs/heads/research/multifixture-assurance-v1:refs/assurance/multifixture-assurance-v1-original
      - name: Restore cross-system development history
        run: git fetch --no-tags research/history/cross_system_feasibility_v1.bundle refs/heads/research/cross-system-assurance-v1:refs/assurance/cross-system-feasibility-v1-original
      - name: Restore adapted delivery development history
        run: git fetch --no-tags research/history/cross_system_delivery_v1.bundle refs/heads/research/cross-system-assurance-v1:refs/assurance/cross-system-delivery-v1-original
      - name: Restore paired protocol freeze and collection history
        run: git fetch --no-tags research/history/paired_cross_system_v1.bundle refs/heads/research/paired-cross-system-benchmark-v1:refs/assurance/paired-cross-system-v1-original
      - name: Restore fair paired v2 protocol and receipt history
        run: git fetch --no-tags research/history/paired_cross_system_v2.bundle refs/heads/research/fair-paired-cross-system-v2:refs/assurance/paired-cross-system-v2-original
      - name: Restore request-bound v3 source and receipt history
        run: git fetch --no-tags research/history/paired_cross_system_v3.bundle refs/heads/feature/request-bound-harmonization:refs/assurance/paired-cross-system-v3-original
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install mido==1.3.3
      - run: python -m research.validate_release_assurance
      - name: Replay archived v1/v2 gates at their last green source snapshot
        run: |
          git worktree add --detach "$RUNNER_TEMP/cm-pre-v3" e6913b0bcad1b919a74e5f4632c48712b9ce6fe2
          (
            cd "$RUNNER_TEMP/cm-pre-v3"
            export PYTHONPATH="$PWD/src:$PWD"
            python -m research.multifixture_assurance --check
            python -m research.cross_system_assurance_v1.feasibility --check
            python -m research.cross_system_delivery_v1.pilot --check
            python -m research.paired_cross_system_v1.runner check
            python -m research.paired_cross_system_v1.analysis --check
            python -m research.check_paired_v2
          )
          git worktree remove "$RUNNER_TEMP/cm-pre-v3"
      - name: Diagnose v3 cross-Python summary drift
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from research.paired_cross_system_v3.runner import ROOT, analyze
          actual = analyze()
          expected = json.loads((ROOT / "summary.json").read_text())
          def walk(a, b, path=()):
              if isinstance(a, dict) and isinstance(b, dict):
                  for key in sorted(set(a) | set(b)):
                      yield from walk(a.get(key), b.get(key), (*path, key))
              elif isinstance(a, list) and isinstance(b, list):
                  for i, (x, y) in enumerate(zip(a, b)):
                      yield from walk(x, y, (*path, i))
              elif type(a) is not type(b) or a != b:
                  yield (path, a, b)
          for path, value, archived in walk(actual, expected):
              print("v3-diff", path, repr(value), repr(archived))
          PY
      - run: python -m research.check_paired_v3

  checker-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -c "from constraint_music.certification import verify_artifact; assert callable(verify_artifact)"

      - run: python -c "from constraint_music.harmonization import verify_harmonization; from constraint_music.harmonization.midi import verify_midi; assert callable(verify_harmonization) and callable(verify_midi)"
