name: v2.8 inner-leading diagnostic

on:
  push:
    branches: ["staging/v2.8-typefix"]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Pinpoint inner-voice leading-tone conflicts
        run: |
          python - <<'PY'
          from ortools.sat.python import cp_model
          from constraint_music.models import GenerationSpec
          from constraint_music.search import DEFAULT_OBJECTIVE_WEIGHTS, normalize_objective_weights
          from constraint_music.solver import ConstraintMusicSolver

          spec = GenerationSpec(
              bars=2, beats_per_bar=4, subdivisions_per_beat=1,
              require_authentic_cadence=False,
              modulation_enabled=True, modulation_destination_key="G",
              modulation_boundary_beat=2, avoid_parallel_perfects=False,
              workers=1, seed=2808, max_time_seconds=5,
              tension_curve=(0.05,0.15,0.35,0.55,0.75,0.9,0.6,0.1),
              resolve_leading_tone=False,
          )
          weights = normalize_objective_weights(DEFAULT_OBJECTIVE_WEIGHTS)
          pcs = set()
          for key in spec.context_keys:
              pcs.update(key.pitch_classes)
          domains = {
              "alto": tuple(n for n in range(55, 75) if n % 12 in pcs),
              "tenor": tuple(n for n in range(48, 68) if n % 12 in pcs),
          }

          def solve(label, constraints):
              problem = ConstraintMusicSolver()._compile(spec, weights)
              for voice_name, beat in constraints:
                  variables = getattr(problem.satb, voice_name)
                  key = spec.active_key_at_beat(beat)
                  rows = [
                      (left, right)
                      for left in domains[voice_name]
                      for right in domains[voice_name]
                      if left % 12 != key.leading_tone_pc or right == left + 1
                  ]
                  problem.model.add_allowed_assignments(
                      [variables[beat], variables[beat + 1]], rows
                  )
              solver = cp_model.CpSolver()
              solver.parameters.max_time_in_seconds = 5
              solver.parameters.num_search_workers = 1
              status = solver.solve(problem.model)
              print(label, solver.status_name(status))
              if status in (cp_model.OPTIMAL, cp_model.FEASIBLE):
                  print(" chords", [solver.value(v) for v in problem.chord])
                  print(" alto", [solver.value(v) for v in problem.satb.alto])
                  print(" tenor", [solver.value(v) for v in problem.satb.tenor])

          all_constraints = []
          for voice in ("alto", "tenor"):
              for beat in range(spec.total_beats - 1):
                  solve(f"{voice}-beat{beat}", [(voice, beat)])
                  all_constraints.append((voice, beat))
          for cutoff in range(1, len(all_constraints) + 1):
              solve(f"cumulative-{cutoff}-{all_constraints[cutoff-1]}", all_constraints[:cutoff])
          PY
